<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Sample image: a gradient horizon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#2a2566"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f7dff"/>
      <stop offset="1" stop-color="#3fd9c3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#sky)"/>
  <circle cx="600" cy="330" r="150" fill="url(#sun)"/>
  <rect y="330" width="1200" height="170" fill="#0b0d12"/>
  <text x="600" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#9aa1b3">sample.svg · replace me</text>
</svg>
